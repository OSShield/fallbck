# FallBCK local / single-host stack.
#
#   docker compose up -d                                   # postgres + server (admin auth DISABLED, dev only)
#   docker compose --profile agent up -d                   # ... plus an example agent (needs an enrollment token, see below)
#   docker compose --profile db-agent up -d                # ... plus an agent with database tools (can back up the stack's own Postgres)
#   docker compose -f docker-compose.yml -f compose.sso.yml up -d
#                                                          # ... behind Caddy (TLS) with dex as OIDC provider:
#                                                          #     https://fallbck.localhost  (admin@example.com / password)
#
# The server embeds Temporal and the Temporal Web UI; there is no separate Temporal
# container any more. Everything (Web UI, REST API, PBS proxy, agent gRPC) is served on
# one plaintext h2c port (8080) that a TLS-terminating reverse proxy should front.
#
# Run from the deploy/ directory (or pass -f deploy/docker-compose.yml). Images are built
# from the repository root with Dockerfile.server / Dockerfile.agent (targets slim and tools).

services:
  # -------------------------------------------------------------------------
  # 1. PostgreSQL (application DB + Temporal's `temporal` / `temporal_visibility`,
  #    created by the server on first start; the compose user is a superuser)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fallbck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fallbck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fallbck_password}
      POSTGRES_DB: fallbck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fallbck -d fallbck"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fallbck-net

  # -------------------------------------------------------------------------
  # 2. FallBCK server: Web UI + API + PBS proxy + embedded Temporal + agent gateway
  # -------------------------------------------------------------------------
  server:
    image: oci.fi/fallbck/server:latest
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        FALLBCK_VERSION: ${FALLBCK_VERSION:-0.3.0}
    container_name: fallbck-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # --dev permits FALLBCK_AUTH_INSECURE_DISABLE; drop it (and set OIDC) for real use
    command: ["--dev"]
    environment:
      - FALLBCK_HTTP_PORT=8080
      - FALLBCK_HTTP_BIND=0.0.0.0
      - FALLBCK_PUBLIC_URL=${FALLBCK_PUBLIC_URL:-http://localhost:8080}
      - FALLBCK_JWT_SECRET=${FALLBCK_JWT_SECRET:-change-me-in-production-fallbck-secret-key-32bytes}
      - FALLBCK_DATA_DIR=/var/lib/fallbck/server
      - FALLBCK_DB_URL=postgres://fallbck:${POSTGRES_PASSWORD:-fallbck_password}@postgres:5432/fallbck?sslmode=disable
      - FALLBCK_TEMPORAL_MODE=embedded
      - FALLBCK_TEMPORAL_NAMESPACE=default
      # Development only: no admin login. compose.sso.yml turns this off and configures OIDC.
      - FALLBCK_AUTH_INSECURE_DISABLE=${FALLBCK_AUTH_INSECURE_DISABLE:-true}
      # Cron schedules and next-run display follow this timezone (default UTC)
      - TZ=${TZ:-UTC}
      - FALLBCK_OIDC_ISSUER=${FALLBCK_OIDC_ISSUER:-}
      - FALLBCK_OIDC_CLIENT_ID=${FALLBCK_OIDC_CLIENT_ID:-}
      - FALLBCK_OIDC_CLIENT_SECRET=${FALLBCK_OIDC_CLIENT_SECRET:-}
      # DEBUG=true for verbose logs (PBS session handshakes, Temporal info logs)
      - DEBUG=${DEBUG:-false}
    ports:
      - "8080:8080"
    volumes:
      - server_data:/var/lib/fallbck/server
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - fallbck-net

  # -------------------------------------------------------------------------
  # 3. FallBCK backup agent (example host worker container, opt-in profile)
  #
  # An agent must be enrolled with a one-time token before it can run, so this
  # service is behind the "agent" profile. To use it:
  #
  #   1. Create an enrollment token (Web UI -> Enrollment Tokens, or with an API key:
  #        FALLBCK_API_KEY=fbk_... fallbck-ctl token create
  #      or, while auth is disabled:
  #        curl -s -X POST http://localhost:8080/api/v1/tokens -H 'Content-Type: application/json' -d '{"name":"compose-agent"}')
  #   2. Start the agent with the raw token; it enrolls itself on first start and
  #      persists agent.yaml (with its bearer token) in the agent_data volume:
  #        FALLBCK_AGENT_ENROLLMENT_KEY=<raw_token> docker compose --profile agent up -d
  #
  # The agent talks to http://server:8080 for everything (REST + Temporal gRPC over h2c).
  # -------------------------------------------------------------------------
  agent:
    image: oci.fi/fallbck/agent:latest
    build:
      context: ..
      dockerfile: Dockerfile.agent
      target: slim
      args:
        FALLBCK_VERSION: ${FALLBCK_VERSION:-0.3.0}
    container_name: fallbck-agent
    restart: unless-stopped
    profiles:
      - agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      - FALLBCK_AGENT_SERVER_URL=http://server:8080
      - FALLBCK_AGENT_ENROLLMENT_KEY=${FALLBCK_AGENT_ENROLLMENT_KEY:-}
      - FALLBCK_AGENT_DATA_DIR=/var/lib/fallbck/agent
      - DEBUG=${DEBUG:-false}
    volumes:
      - agent_data:/var/lib/fallbck/agent
      - sample_backup_data:/backup-data
    networks:
      - fallbck-net

  # -------------------------------------------------------------------------
  # 3b. Agent for Docker host backups (optional, profile "docker-host-agent"): the
  #     same image run as root with the Docker socket, the volumes directory and the
  #     compose project directories mounted, so the "Docker host" job type can archive
  #     container/network/volume definitions, compose files and every named volume.
  #     FALLBCK_AGENT_HOSTNAME names the agent and its snapshot group (host/<name>-docker).
  #       FALLBCK_AGENT_ENROLLMENT_KEY=<raw_token> docker compose --profile docker-host-agent up -d
  # -------------------------------------------------------------------------
  docker-host-agent:
    image: oci.fi/fallbck/agent:latest
    build:
      context: ..
      dockerfile: Dockerfile.agent
      target: slim
      args:
        FALLBCK_VERSION: ${FALLBCK_VERSION:-0.3.0}
    container_name: fallbck-docker-host-agent
    restart: unless-stopped
    user: "0:0"
    profiles:
      - docker-host-agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      - FALLBCK_AGENT_HOSTNAME=${HOSTNAME:-docker-host}
      - FALLBCK_AGENT_SERVER_URL=http://server:8080
      - FALLBCK_AGENT_ENROLLMENT_KEY=${FALLBCK_AGENT_ENROLLMENT_KEY:-}
      - FALLBCK_AGENT_DATA_DIR=/var/lib/fallbck/agent
      - FALLBCK_AGENT_DOCKER_VOLUME_ACCESS=auto
      - DEBUG=${DEBUG:-false}
    volumes:
      - docker_host_agent_data:/var/lib/fallbck/agent
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - /etc/docker:/etc/docker:ro
    networks:
      - fallbck-net

  # -------------------------------------------------------------------------
  # 4. Agent with database tools (optional, profile "db-agent"): the same agent image
  #    in its "tools" flavour (PostgreSQL, MariaDB and MongoDB client tools), so it
  #    reports db_tools and can run database jobs. The profile "postgres" below lets a
  #    job against postgres:5432 (user fallbck) leave its password blank.
  # -------------------------------------------------------------------------
  db-agent:
    image: oci.fi/fallbck/agent:tools
    build:
      context: ..
      dockerfile: Dockerfile.agent
      target: tools
      args:
        FALLBCK_VERSION: ${FALLBCK_VERSION:-0.3.0}
    container_name: fallbck-db-agent
    restart: unless-stopped
    profiles:
      - db-agent
    depends_on:
      server:
        condition: service_healthy
    environment:
      - FALLBCK_AGENT_HOSTNAME=${HOSTNAME:-db-agent}
      - FALLBCK_AGENT_SERVER_URL=http://server:8080
      - FALLBCK_AGENT_ENROLLMENT_KEY=${FALLBCK_DB_AGENT_ENROLLMENT_KEY:-}
      - FALLBCK_AGENT_DATA_DIR=/var/lib/fallbck/agent
      - FALLBCK_AGENT_DB_PROFILE_POSTGRES_USER=fallbck
      - FALLBCK_AGENT_DB_PROFILE_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fallbck_password}
      - DEBUG=${DEBUG:-false}
    volumes:
      - db_agent_data:/var/lib/fallbck/agent
    networks:
      - fallbck-net

  k8s-agent:
    image: oci.fi/fallbck/k8s-agent:latest
    build:
      context: ..
      dockerfile: Dockerfile.k8s-agent
      args:
        FALLBCK_VERSION: ${FALLBCK_VERSION:-0.3.0}
    profiles:
      - k8s

volumes:
  docker_host_agent_data:
  postgres_data:
  server_data:
  agent_data:
  db_agent_data:
  sample_backup_data:

networks:
  fallbck-net:
    driver: bridge
