# The FallBCK server (reverse proxy) URL — required
server:
  url: ""
  # PEM bundle of a private CA to trust for server.url (inline). Applies to enrollment,
  # the agent's API/gRPC connections and the worker pods.
  caCert: ""
  # Skip certificate verification for server.url (testing only)
  insecureSkipVerify: false

# Cluster name — required; becomes the agent identity (k8s-<clusterName>) and the PBS
# backup group prefix (host/k8s-<clusterName>[-pvc-<ns>-<name>])
clusterName: ""

enrollment:
  # One-time enrollment token (creates a Secret); ignored once the agent is enrolled
  key: ""
  # ... or reference an existing Secret with key "enrollment-key"
  existingSecret: ""

# The agent stores its enrolled identity (agent id, task queue, bearer token) here.
# It is agent-owned: helm upgrade/uninstall leaves it alone. Delete it to re-enroll.
identitySecretName: fallbck-k8s-agent-identity
# Database jobs keep their chain state (last binlog position / WAL LSN) per job here;
# agent-owned like the identity Secret.
stateSecretName: fallbck-k8s-agent-state

image:
  repository: cr.osshield.eu/fallbck/k8s-agent
  # Empty = the chart's appVersion (the release this chart shipped with)
  tag: ""
  pullPolicy: IfNotPresent

# Pod/container hardening for the agent itself (workers have their own, see worker.*)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10004
  runAsGroup: 10004
  fsGroup: 10004
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# NetworkPolicy for the agent pod: nothing may connect to it; outbound is limited to
# DNS, the API server and the CIDRs you list (the FallBCK server, and PBS for direct
# jobs). Off by default because the API server and server addresses differ per cluster.
networkPolicy:
  enabled: false
  # Extra egress destinations, as NetworkPolicy egress rules (verbatim)
  egress: []
  #  - to: [{ipBlock: {cidr: 10.0.0.5/32}}]
  #    ports: [{port: 443, protocol: TCP}]

# Worker pods (one per volume, run in the volume's namespace)
worker:
  # Defaults to the agent image
  image: ""
  pullPolicy: Always
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  # Bounds gopbs upload concurrency inside the worker via GOMAXPROCS. Without it the
  # worker uses the node's CPU count, so peak memory scales with node size and large
  # volumes OOM. Keep it small (2) unless volumes are huge and you raise the memory limit.
  maxProcs: 2
  # Container securityContext for workers. Default (set by the agent when empty):
  # root with all capabilities dropped except DAC_OVERRIDE, read-only rootfs —
  # needed to read arbitrarily-owned PVC files and admitted by Pod Security "baseline".
  # In a "restricted" namespace the agent retries as the user of the pod that mounts
  # the PVC (or the PVC's fallbck.io/run-as-user / run-as-group annotations), which
  # backs up what that user can read. Exempting the agent's service account from Pod
  # Security admission (see admissionPolicy) keeps the root worker there too.
  # Setting this disables both and applies to every namespace.
  securityContext: {}

  # Database jobs assigned to this agent run in a dump pod in the database's namespace:
  # an init container copies the agent binary out of the agent image, the main
  # container is the engine's own image (it carries pg_dump / mariadb-dump / mongodump),
  # so the client tools always match the server. {major} is replaced with the server
  # version the agent detects (MongoDB cannot be probed and uses "latest"); a job can
  # pin an image with its "tools image" setting.
  db:
    images:
      postgres: "postgres:{major}"
      mysql: "mysql:{major}"
      mariadb: "mariadb:{major}"
      mongodb: "mongo:{major}"
    # The dump is spooled in an emptyDir before upload; size it for the largest dump
    spoolSizeLimit: 20Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    # Container securityContext for dump pods. Default (set by the agent when empty):
    # uid/gid 999 (the engine user in the official images), all capabilities dropped,
    # read-only rootfs, RuntimeDefault seccomp — admitted by Pod Security "restricted".
    securityContext: {}

# PriorityClass on every volume worker and database dump pod, so cluster policy can
# single them out. E.g. leave them out of a namespace ResourceQuota (which otherwise
# demands limits.cpu and caps them at the site's headroom) with
#   scopeSelector: {matchExpressions: [{scopeName: PriorityClass, operator: NotIn,
#                                       values: [fallbck-backup]}]}
# or match them in Kyverno / Gatekeeper exclusions. Value 0 and preemptionPolicy Never:
# no scheduling advantage over ordinary pods. It's cluster-scoped, so a second agent
# release in the same cluster sets create: false and reuses the name.
workerPriorityClass:
  create: true
  name: fallbck-backup

# Guard rails for a Pod Security admission exemption. If you exempt the agent's service
# account (system:serviceaccount:<namespace>:fallbck-k8s-agent) in the API server's
# PodSecurity configuration so workers keep full file access in "restricted" namespaces,
# enable this: a ValidatingAdmissionPolicy (Kubernetes 1.30+) then holds every pod that
# service account creates to what the workers need — only PVC and emptyDir volumes, no
# host namespaces or ports, not privileged, no privilege escalation, no capability but
# DAC_OVERRIDE, no Unconfined seccomp, labelled as a fallbck worker. Without it a leaked
# agent token could start privileged pods anywhere.
admissionPolicy:
  enabled: false

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# The resource dump is staged here before upload; size for your cluster's YAML volume
spool:
  sizeLimit: 2Gi
  # ... or use a PVC instead of an emptyDir
  existingClaim: ""

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
