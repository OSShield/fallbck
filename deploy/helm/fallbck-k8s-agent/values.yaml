# The FallBCK server (reverse proxy) URL — required
server:
  url: ""
  # PEM bundle of a private CA to trust for server.url (inline). Applies to enrollment,
  # the agent's API/gRPC connections and the worker pods.
  caCert: ""
  # Skip certificate verification for server.url (testing only)
  insecureSkipVerify: false

# Cluster name — required; becomes the agent identity (k8s-<clusterName>) and the PBS
# backup group prefix (host/k8s-<clusterName>[-pvc-<ns>-<name>])
clusterName: ""

enrollment:
  # One-time enrollment token (creates a Secret); ignored once the agent is enrolled
  key: ""
  # ... or reference an existing Secret with key "enrollment-key"
  existingSecret: ""

# The agent stores its enrolled identity (agent id, task queue, bearer token) here.
# It is agent-owned: helm upgrade/uninstall leaves it alone. Delete it to re-enroll.
identitySecretName: fallbck-k8s-agent-identity
# Database jobs keep their chain state (last binlog position / WAL LSN) per job here;
# agent-owned like the identity Secret.
stateSecretName: fallbck-k8s-agent-state

image:
  repository: oci.fi/fallbck/k8s-agent
  tag: latest
  pullPolicy: Always

# Worker pods (one per volume, run in the volume's namespace)
worker:
  # Defaults to the agent image
  image: ""
  pullPolicy: Always
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  # Bounds gopbs upload concurrency inside the worker via GOMAXPROCS. Without it the
  # worker uses the node's CPU count, so peak memory scales with node size and large
  # volumes OOM. Keep it small (2) unless volumes are huge and you raise the memory limit.
  maxProcs: 2
  # Container securityContext for workers. Default (set by the agent when empty):
  # root with all capabilities dropped except DAC_OVERRIDE, read-only rootfs —
  # needed to read arbitrarily-owned PVC files and admitted by Pod Security "baseline".
  # Override for "restricted" namespaces, e.g. run as the uid that owns the PVC data:
  #   securityContext: {runAsUser: 991, runAsNonRoot: true, allowPrivilegeEscalation: false,
  #                     readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
  securityContext: {}

  # Database jobs assigned to this agent run in a dump pod in the database's namespace:
  # an init container copies the agent binary out of the agent image, the main
  # container is the engine's own image (it carries pg_dump / mariadb-dump / mongodump),
  # so the client tools always match the server. {major} is replaced with the server
  # version the agent detects (MongoDB cannot be probed and uses "latest"); a job can
  # pin an image with its "tools image" setting.
  db:
    images:
      postgres: "postgres:{major}"
      mysql: "mysql:{major}"
      mariadb: "mariadb:{major}"
      mongodb: "mongo:{major}"
    # The dump is spooled in an emptyDir before upload; size it for the largest dump
    spoolSizeLimit: 20Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 2Gi}
    # Container securityContext for dump pods. Default (set by the agent when empty):
    # root, all capabilities dropped, read-only rootfs (spool and /tmp are emptyDirs).
    securityContext: {}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}

# The resource dump is staged here before upload; size for your cluster's YAML volume
spool:
  sizeLimit: 2Gi
  # ... or use a PVC instead of an emptyDir
  existingClaim: ""

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
