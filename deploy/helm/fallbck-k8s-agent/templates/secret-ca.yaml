{{- if .Values.server.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fallbck-k8s-agent.name" . }}-server-ca
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fallbck-k8s-agent.labels" . | nindent 4 }}
stringData:
  server-ca.crt: {{ .Values.server.caCert | quote }}
{{- end }}
