apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fallbck-k8s-agent.name" . }}-{{ .Release.Namespace }}
  labels: {{- include "fallbck-k8s-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "fallbck-k8s-agent.name" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fallbck-k8s-agent.name" . }}
    namespace: {{ .Release.Namespace }}
