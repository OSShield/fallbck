{{- if and .Values.enrollment.key (not .Values.enrollment.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fallbck-k8s-agent.name" . }}-enrollment
  namespace: {{ .Release.Namespace }}
  labels: {{- include "fallbck-k8s-agent.labels" . | nindent 4 }}
stringData:
  enrollment-key: {{ .Values.enrollment.key | quote }}
{{- end }}
