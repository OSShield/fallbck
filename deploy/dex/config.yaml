# dex OIDC provider for local development (compose.sso.yml).
# Static user: admin@example.com / password
issuer: https://fallbck.localhost/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: fallbck
    name: FallBCK
    secret: fallbck-dev-secret
    redirectURIs:
      - https://fallbck.localhost/auth/callback

enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    # bcrypt("password")
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
