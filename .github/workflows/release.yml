  windows:
    name: Windows agent (vet, tests, MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./cmd/fallbck-agent ./pkg/agent/... ./pkg/config ./pkg/db
      - name: Unit tests (portable packages)
        run: go test ./pkg/config ./pkg/db ./pkg/agent/backup ./pkg/agent/runtime ./pkg/agent/vss
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build agent
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.AgentVersion=${{ steps.version.outputs.version }}" -o dist/fallbck-agent.exe ./cmd/fallbck-agent
      - name: Build MSI (WiX)
        shell: bash
        run: |
          WIXDIR="${WIX:-/c/Program Files (x86)/WiX Toolset v3.14}/bin"
          if [ ! -f "$WIXDIR/candle.exe" ]; then echo "WiX Toolset not found in $WIXDIR"; exit 1; fi
          "$WIXDIR/candle.exe" -nologo -arch x64 -dVersion=${{ steps.version.outputs.version }} -dSource=dist/fallbck-agent.exe -ext WixUtilExtension -o dist/fallbck-agent.wixobj deploy/windows/fallbck-agent.wxs
          "$WIXDIR/light.exe" -nologo -ext WixUtilExtension -o dist/fallbck-agent_Windows_x86_64.msi dist/fallbck-agent.wixobj
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-${{ github.sha }}
          retention-days: 7
          path: dist/fallbck-agent_Windows_x86_64.msi

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog needs history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Snapshot build (PRs and main)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_DEBPKG_SECRET: ${{ secrets.PKG_UPLOAD_PASSWORD }}
          UPLOAD_APKPKG_SECRET: ${{ secrets.PKG_UPLOAD_PASSWORD }}
          UPLOAD_RPMPKG_SECRET: ${{ secrets.PKG_UPLOAD_PASSWORD }}

      - name: Attach the Windows MSI to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v4
        with:
          name: windows-msi-${{ github.sha }}
          path: dist/msi
      - name: Upload MSI to the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" dist/msi/fallbck-agent_Windows_x86_64.msi --clobber

      - name: Upload snapshot packages
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          retention-days: 7
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.tar.gz
