name: Release

on:
  push:
    tags:
      - "v*"
    # Snapshot build (no publishing) on main to keep the packaging working
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests (embedded Temporal on sqlite)
        run: go test -tags sqlite -count=1 ./pkg/temporal/embedded/ ./pkg/integration/

