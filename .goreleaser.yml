version: 2

builds:
  - id: fallbck-server
    main: ./cmd/fallbck-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.ServerVersion={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: fallbck-server

  - id: fallbck-agent
    main: ./cmd/fallbck-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.AgentVersion={{ .Version }}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    binary: fallbck-agent

  - id: fallbck-k8s-agent
    main: ./cmd/fallbck-k8s-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.AgentVersion={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    binary: fallbck-k8s-agent

archives:
  - id: fallbck-server
    ids:
      - fallbck-server
    name_template: >-
      {{ .ProjectName }}_server_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  
  - id: fallbck-agent
    ids:
      - fallbck-agent
    name_template: >-
      {{ .ProjectName }}_agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: fallbck-k8s-agent
    ids:
      - fallbck-k8s-agent
    name_template: >-
      {{ .ProjectName }}_k8s_agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: fallbck-server
    ids:
      - fallbck-server
    package_name: "fallbck-server"
    description: "fallbck-server - Backup server"
    vendor: "clysec"
    maintainer: clysec
    file_name_template: >-
      {{ .ProjectName }}_server_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - deb
      - apk
      - rpm
    bindir: /usr/local/bin
    contents:
      # systemd (deb / rpm)
      - src: deploy/systemd/fallbck-server.service
        dst: /usr/lib/systemd/system/fallbck-server.service
        packager: deb
      - src: deploy/systemd/fallbck-server.service
        dst: /usr/lib/systemd/system/fallbck-server.service
        packager: rpm
      # OpenRC (apk)
      - src: deploy/openrc/fallbck-server.initd
        dst: /etc/init.d/fallbck-server
        packager: apk
        file_info:
          mode: 0755
      - src: deploy/openrc/fallbck-server.confd
        dst: /etc/conf.d/fallbck-server
        type: config|noreplace
        packager: apk
      # configuration
      - src: deploy/server.yaml.example
        dst: /etc/fallbck/server.yaml
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: fallbck
      - src: deploy/packaging/server.env
        dst: /etc/fallbck/server.env
        type: config|noreplace
        file_info:
          mode: 0640
          owner: root
          group: fallbck
      - src: deploy/caddy/Caddyfile.production.example
        dst: /usr/share/doc/fallbck-server/Caddyfile.example
      - src: deploy/nginx.conf.example
        dst: /usr/share/doc/fallbck-server/nginx.conf.example
      - dst: /etc/fallbck
        type: dir
        file_info:
          mode: 0755
      # the fallbck user is created by the preinstall script, so it exists at unpack time
      - dst: /var/lib/fallbck/server
        type: dir
        file_info:
          mode: 0750
          owner: fallbck
          group: fallbck
      - dst: /var/log/fallbck
        type: dir
        file_info:
          mode: 0750
          owner: fallbck
          group: fallbck
    scripts:
      preinstall: deploy/packaging/scripts/server-preinstall.sh
      postinstall: deploy/packaging/scripts/server-postinstall.sh
      preremove: deploy/packaging/scripts/server-preremove.sh
      postremove: deploy/packaging/scripts/server-postremove.sh
    apk:
      # apk has no pre/post-install argument convention; scripts handle it
      scripts:
        preupgrade: deploy/packaging/scripts/server-preinstall.sh
        postupgrade: deploy/packaging/scripts/server-postinstall.sh
    rpm:
      summary: FallBCK backup server
    deb:
      fields:
        Bugs: https://github.com/osshield/fallbck/issues
  
  - id: fallbck-agent
    ids:
      - fallbck-agent
    package_name: "fallbck-agent"
    description: "fallbck-agent - Backup agent (filesystem, Proxmox VE and Docker hosts; databases with the client tools installed)"
    vendor: "clysec"
    maintainer: clysec
    # Database jobs need the vendor client tools; they are optional (suggested, not
    # pulled in) because most hosts only back up files
    suggests:
      - postgresql-client
      - mariadb-client
    file_name_template: >-
      {{ .ProjectName }}_agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    formats:
      - deb
      - apk
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: deploy/systemd/fallbck-agent.service
        dst: /usr/lib/systemd/system/fallbck-agent.service
        packager: deb
      - src: deploy/systemd/fallbck-agent.service
        dst: /usr/lib/systemd/system/fallbck-agent.service
        packager: rpm
      - src: deploy/openrc/fallbck-agent.initd
        dst: /etc/init.d/fallbck-agent
        packager: apk
        file_info:
          mode: 0755
      - src: deploy/openrc/fallbck-agent.confd
        dst: /etc/conf.d/fallbck-agent
        type: config|noreplace
        packager: apk
      - src: deploy/agent.yaml.example
        dst: /usr/share/doc/fallbck-agent/agent.yaml.example
      - src: deploy/packaging/agent.env
        dst: /etc/fallbck/agent.env
        type: config|noreplace
        file_info:
          mode: 0600
      - dst: /etc/fallbck
        type: dir
        file_info:
          mode: 0755
      - dst: /var/lib/fallbck/agent
        type: dir
        file_info:
          mode: 0700
    scripts:
      postinstall: deploy/packaging/scripts/agent-postinstall.sh
      preremove: deploy/packaging/scripts/agent-preremove.sh
      postremove: deploy/packaging/scripts/agent-postremove.sh
    apk:
      scripts:
        postupgrade: deploy/packaging/scripts/agent-postinstall.sh
    rpm:
      summary: FallBCK backup agent
    deb:
      fields:
        Bugs: https://github.com/osshield/fallbck/issues

uploads:
  - name: "debpkg"
    skip: "{{ ne (envOrDefault \"GITHUB_RUN_ID\" \"\") \"\" }}"
    ids:
      - fallbck-server
      - fallbck-agent
    method: "PUT"
    exts:
      - deb
    mode: archive
    username: "linux_push"
    target: https://deb.pkg.lv/upload?dist=all&component=main
    custom_artifact_name: true

  - name: "apkpkg"
    skip: "{{ ne (envOrDefault \"GITHUB_RUN_ID\" \"\") \"\" }}"
    ids:
      - fallbck-server
      - fallbck-agent
    method: "PUT"
    exts:
      - apk
    mode: archive
    username: "linux_push"
    target: https://alpine.pkg.lv/upload?repo=all
    custom_artifact_name: true

  - name: "rpmpkg"
    skip: "{{ ne (envOrDefault \"GITHUB_RUN_ID\" \"\") \"\" }}"
    ids:
      - fallbck-server
      - fallbck-agent
    method: "PUT"
    exts:
      - rpm
    mode: archive
    username: "linux_push"
    target: https://rpm.pkg.lv/upload?repo=all
    custom_artifact_name: true

release:
  disable: "{{ eq (envOrDefault \"GITHUB_RUN_ID\" \"\") \"\" }}"
  github: {}
